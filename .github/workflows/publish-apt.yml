name: Vyro OS — APT repo publish

# Runs after the ISO build workflow completes successfully on a vA.* tag.
# Assembles the .debs that were built during ISO production into a flat
# Debian archive and pushes it to the gh-pages branch where GitHub Pages
# serves it from https://gaurav06120714.github.io/VyroOs/apt.

on:
  workflow_run:
    workflows: ["Vyro OS — Path A ISO build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build + publish Vyro APT repo
    runs-on: ubuntu-24.04
    # Only run when the triggering ISO build succeeded *and* it ran for a tag.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'vA.'))

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg rsync

      - name: Download ISO-build artifacts (.debs)
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/

      - name: Collect .debs from artifacts into packages.chroot
        run: |
          mkdir -p path-a-ubuntu-remix/live-build/config/packages.chroot
          # Artifacts are named per-arch ISOs; the .debs live in the same
          # path inside each artifact bundle.
          find artifacts/ -name '*.deb' -print0 | \
              xargs -0 -I{} cp -v {} path-a-ubuntu-remix/live-build/config/packages.chroot/
          ls -la path-a-ubuntu-remix/live-build/config/packages.chroot/

      - name: Build APT repo
        env:
          # Set VYRO_GPG_KEY as a repo secret to enable signing. If unset,
          # the repo is built unsigned (apt will complain but install works
          # with [trusted=yes] in sources.list).
          VYRO_GPG_KEY: ${{ secrets.VYRO_GPG_KEY }}
        run: |
          OUT_DIR="${PWD}/apt-out" \
              path-a-ubuntu-remix/scripts/build-apt-repo.sh

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "Gaurav06120714"
          git config user.email "gauravganeshteegulla@gmail.com"

          # Fetch / create the orphan gh-pages branch
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
              git fetch origin gh-pages:gh-pages
              git worktree add pages-tree gh-pages
          else
              git worktree add --orphan -b gh-pages pages-tree
              ( cd pages-tree && git rm -rf . 2>/dev/null || true )
          fi

          # Sync the freshly-built repo into pages-tree/apt/
          mkdir -p pages-tree/apt
          rsync -a --delete apt-out/ pages-tree/apt/

          # Stash a marker file so GitHub Pages serves a real index page
          cat > pages-tree/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>Vyro OS APT Repository</title>
          <body style="font-family:Inter,sans-serif;background:#0B0B12;color:#E8E9F1;padding:48px;max-width:720px;margin:0 auto;">
            <h1 style="color:#B388FF;">Vyro OS APT Repository</h1>
            <p>This site hosts the Vyro OS Debian package repository.</p>
            <p>To use, install the <code>vyro-apt-source</code> package on a Vyro OS Path A install, or add manually:</p>
            <pre style="background:#141620;padding:16px;border-radius:14px;">deb https://gaurav06120714.github.io/VyroOs/apt noble main</pre>
            <p><a href="https://github.com/Gaurav06120714/VyroOs" style="color:#B388FF;">github.com/Gaurav06120714/VyroOs</a></p>
          </body>
          EOF

          ( cd pages-tree && \
            git add -A && \
            ( git diff --cached --quiet || \
              git commit -m "vA.7.X: publish APT repo from ${GITHUB_SHA::7}" ) && \
            git push origin gh-pages )
