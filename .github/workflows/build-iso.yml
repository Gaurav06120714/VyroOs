name: Vyro OS — Path A ISO build

on:
  push:
    branches: [main]
    paths:
      - 'path-a-ubuntu-remix/**'
      - '.github/workflows/build-iso.yml'
    tags:
      - 'vA.*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Draft a GitHub Release with the ISO attached?'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Vyro OS ISO (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          # Path A primary track — x86_64 PCs / Intel Macs
          - arch: amd64
            runner: ubuntu-24.04
            grub_pkg: grub-efi-amd64-bin
            extra_pkgs: grub-pc-bin
            track: Path A
            base_note: Ubuntu 24.04 LTS, kernel 6.8, GNOME 46
            target_note: x86_64 PCs (BIOS or UEFI), pre-T2 Intel Macs via CSM
          # Path A2 secondary track — Apple Silicon / Asahi-style
          - arch: arm64
            runner: ubuntu-24.04-arm
            grub_pkg: grub-efi-arm64-bin
            extra_pkgs: ""
            track: Path A2 (Asahi-style)
            base_note: Ubuntu 24.04 LTS arm64, kernel 6.8, GNOME 46
            target_note: ARM64 PCs (Ampere, Snapdragon X) and Apple Silicon via Asahi shim (BYO m1n1)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release-notes.sh needs the full tag history

      - name: Install live-build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            mtools \
            librsvg2-bin \
            imagemagick \
            devscripts \
            debhelper \
            meson \
            libgtk-4-dev \
            ${{ matrix.grub_pkg }} \
            ${{ matrix.extra_pkgs }}
          # isolinux/syslinux are amd64-only; install conditionally
          if [[ "${{ matrix.arch }}" == "amd64" ]]; then
            sudo apt-get install -y isolinux syslinux-common
          fi

      - name: Compute version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/vA.}"
          else
            VER="7.0-dev+${GITHUB_SHA::7}"
          fi
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
          echo "iso=vyro-os-${VER}-${{ matrix.arch }}.iso" >> "${GITHUB_OUTPUT}"

      - name: Build ISO
        env:
          VYRO_VERSION: ${{ steps.ver.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          cd path-a-ubuntu-remix
          sudo -E ARCH=${{ matrix.arch }} ./build.sh

      - name: Generate release notes (on tag)
        if: startsWith(github.ref, 'refs/tags/vA.')
        id: notes
        run: |
          NOTES_FILE="path-a-ubuntu-remix/build/RELEASE_NOTES-${{ github.ref_name }}.md"
          bash path-a-ubuntu-remix/scripts/release-notes.sh \
              "${{ github.ref_name }}" \
              "${NOTES_FILE}"
          echo "file=${NOTES_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Compute checksum
        id: sum
        run: |
          ISO="path-a-ubuntu-remix/build/${{ steps.ver.outputs.iso }}"
          SHA=$(cut -d' ' -f1 < "${ISO}.sha256")
          echo "sha256=${SHA}" >> "${GITHUB_OUTPUT}"
          ls -lh "${ISO}"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.iso }}
          path: |
            path-a-ubuntu-remix/build/${{ steps.ver.outputs.iso }}
            path-a-ubuntu-remix/build/${{ steps.ver.outputs.iso }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Draft GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/vA.')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Vyro OS ${{ steps.ver.outputs.version }} (${{ matrix.track }})
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.file }}
          files: |
            path-a-ubuntu-remix/build/${{ steps.ver.outputs.iso }}
            path-a-ubuntu-remix/build/${{ steps.ver.outputs.iso }}.sha256
